<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Revisão PT — Português para a prova</title>
<meta name="description" content="App offline para repasar portugués: tiempos verbales, irregulares y pronombres con feedback."/>
<meta name="theme-color" content="#2456a6"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"/>
<link rel="apple-touch-icon" href="./icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Revisão PT"/>
<style>

        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,520&family=Inter:wght@400;500;600;700&display=swap');

        :root {
          --paper: #f5f8fb;
          --tile: #ffffff;
          --ink: #14283c;
          --ink-soft: #51687e;
          --azul: #2456a6;
          --azul-deep: #16386e;
          --azul-wash: #e2ecf8;
          --amarelo: #e9a13b;
          --verde: #2a8a58;
          --verde-wash: #e3f3ea;
          --vermelho: #bf4430;
          --vermelho-wash: #faeae6;
          --ambar-wash: #fcf2df;
          --radius: 14px;
        }
        * { box-sizing: border-box; }
        body {
          min-height: 100vh;
          background: var(--paper);
          background-image: radial-gradient(var(--azul-wash) 1px, transparent 1px);
          background-size: 26px 26px;
          color: var(--ink);
          font-family: 'Inter', system-ui, sans-serif;
          padding: 28px 18px 64px;
        }
        .container { max-width: 760px; margin: 0 auto; }

        .eyebrow {
          font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
          color: var(--azul); font-weight: 700; margin: 0 0 14px;
        }
        h1 {
          font-family: 'Fraunces', serif; font-weight: 560;
          font-size: clamp(34px, 6vw, 52px); line-height: 1.06; margin: 0 0 16px;
          letter-spacing: -0.01em;
        }
        h1 em { font-style: italic; color: var(--azul); }
        .hero { padding: 18px 0 30px; }
        .hero-sub { color: var(--ink-soft); font-size: 16px; line-height: 1.55; max-width: 54ch; margin: 0 0 22px; }
        .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

        .btn-primary {
          background: var(--azul); color: #fff; border: none; cursor: pointer;
          padding: 13px 22px; border-radius: 999px; font-size: 15px; font-weight: 600;
          font-family: inherit; transition: background .15s ease, transform .1s ease;
        }
        .btn-primary:hover { background: var(--azul-deep); }
        .btn-primary:active { transform: scale(.98); }
        .btn-primary:disabled { opacity: .4; cursor: default; }
        .btn-amber { background: var(--amarelo); color: #4a3104; }
        .btn-amber:hover { background: #d18c25; }
        .progress-infinite { width: 100%; opacity: .35; background: repeating-linear-gradient(90deg, var(--azul) 0 14px, var(--azul-wash) 14px 28px); }
        .btn-ghost {
          background: transparent; color: var(--azul); border: 1.5px solid var(--azul);
          padding: 12px 20px; border-radius: 999px; font-size: 15px; font-weight: 600;
          font-family: inherit; cursor: pointer; transition: background .15s ease;
        }
        .btn-ghost:hover { background: var(--azul-wash); }
        .btn-back {
          background: none; border: none; color: var(--azul); font-weight: 600;
          font-size: 14px; cursor: pointer; padding: 6px 0; font-family: inherit;
        }
        .btn-primary:focus-visible, .btn-ghost:focus-visible, .btn-back:focus-visible, .topic-card:focus-visible {
          outline: 3px solid var(--amarelo); outline-offset: 2px;
        }

        .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .topic-card {
          background: var(--tile); border: 1px solid #dbe6f2; border-top: 4px solid var(--azul);
          border-radius: var(--radius); padding: 18px 16px 14px; text-align: left; cursor: pointer;
          display: flex; flex-direction: column; gap: 6px; font-family: inherit;
          transition: transform .12s ease, box-shadow .12s ease;
        }
        .topic-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20,40,60,.08); }
        .topic-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 560; color: var(--ink); }
        .topic-sub { font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
        .topic-count { font-size: 12px; font-weight: 700; color: var(--azul); margin-top: auto; padding-top: 8px; }

        .section-title { font-family: 'Fraunces', serif; font-weight: 560; font-size: 30px; margin: 14px 0 18px; }

        .quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .quiz-progress { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
        .progress-bar { height: 5px; background: var(--azul-wash); border-radius: 99px; margin: 12px 0 22px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--azul); border-radius: 99px; transition: width .25s ease; }

        .q-card { background: var(--tile); border: 1px solid #dbe6f2; border-radius: var(--radius); padding: 26px 22px; box-shadow: 0 6px 24px rgba(20,40,60,.06); }
        .q-hint { font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; }
        .q-hint strong { color: var(--azul); }
        .q-topic { color: var(--ink-soft); }
        .q-sentence { font-family: 'Fraunces', serif; font-size: clamp(20px, 3.4vw, 26px); line-height: 1.6; margin: 0 0 20px; }
        .q-input {
          font-family: 'Fraunces', serif; font-size: inherit; color: var(--azul-deep);
          border: none; border-bottom: 2.5px solid var(--azul); background: var(--azul-wash);
          border-radius: 6px 6px 0 0; padding: 2px 10px; margin: 0 4px; text-align: center;
          min-width: 90px; max-width: 100%;
        }
        .q-input:focus { outline: none; border-bottom-color: var(--amarelo); }
        .fb-correct-input { background: var(--verde-wash); border-bottom-color: var(--verde); color: var(--verde); }
        .fb-accent-input { background: var(--ambar-wash); border-bottom-color: var(--amarelo); color: #9a6614; }
        .fb-wrong-input { background: var(--vermelho-wash); border-bottom-color: var(--vermelho); color: var(--vermelho); text-decoration: line-through; }

        .q-actions { display: flex; align-items: center; gap: 14px; }
        .kbd-hint { font-size: 12px; color: var(--ink-soft); }

        .feedback { border-radius: 12px; padding: 16px 18px; margin-top: 6px; animation: fadeUp .22s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .q-card { animation: fadeUp .25s ease; }

        .tense-block { margin: -4px 0 14px; }
        .tense-chip {
          display: inline-flex; align-items: center; gap: 8px;
          background: var(--azul-wash); color: var(--azul-deep); border: 1px solid #c9d9ea;
          border-radius: 999px; padding: 6px 14px 6px 6px; font-size: 13px; font-weight: 700;
          font-family: inherit; cursor: pointer; transition: background .12s ease;
        }
        .tense-chip:hover { background: #d4e3f5; }
        .tense-chip-open { background: var(--azul); color: #fff; border-color: var(--azul); }
        .tense-chip-open .tense-dot { background: #fff; color: var(--azul); }
        .tense-chip:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
        .tense-dot {
          width: 22px; height: 22px; border-radius: 50%; background: var(--azul); color: #fff;
          display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800;
        }
        .tense-panel {
          background: linear-gradient(180deg, var(--azul-wash), #f0f6fd);
          border: 1px solid #c9d9ea; border-left: 4px solid var(--azul);
          border-radius: 10px; padding: 12px 14px; margin-top: 10px; animation: fadeUp .2s ease;
        }
        .tense-panel p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
        .tense-panel p:last-child { margin-bottom: 0; }
        .tense-panel strong { color: var(--azul-deep); }

        .fb-icon {
          display: inline-flex; width: 22px; height: 22px; border-radius: 50%;
          align-items: center; justify-content: center; margin-right: 8px;
          font-size: 13px; font-weight: 800; color: #fff; vertical-align: -4px;
        }
        .fb-correct .fb-icon { background: var(--verde); }
        .fb-accent .fb-icon { background: var(--amarelo); font-size: 16px; }
        .fb-wrong .fb-icon { background: var(--vermelho); }
        .fb-why { margin: 0 0 8px; font-size: 14px; line-height: 1.5; background: rgba(255,255,255,.65); border-radius: 8px; padding: 8px 12px; }
        .fb-forma { margin: 0 0 14px; font-size: 13px; color: var(--ink-soft); line-height: 1.5; border-top: 1px dashed rgba(20,40,60,.18); padding-top: 10px; }

        .donut {
          width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
          display: flex; align-items: center; justify-content: center;
        }
        .donut-center {
          width: 68px; height: 68px; border-radius: 50%; background: var(--paper);
          display: flex; align-items: center; justify-content: center;
          font-family: 'Fraunces', serif; font-weight: 650; font-size: 19px; color: var(--ink);
        }
        .score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin: 0 0 18px; }
        .score-pct { margin: 4px 0 0; max-width: 40ch; font-size: 15px; color: var(--ink-soft); font-weight: 600; }
        .fb-correct { background: var(--verde-wash); border: 1px solid #bfe3cf; }
        .fb-accent { background: var(--ambar-wash); border: 1px solid #f0d9ae; }
        .fb-wrong { background: var(--vermelho-wash); border: 1px solid #efc6bc; }
        .fb-label { font-weight: 700; margin: 0 0 8px; font-size: 15px; }
        .fb-correct .fb-label { color: var(--verde); }
        .fb-accent .fb-label { color: #9a6614; }
        .fb-wrong .fb-label { color: var(--vermelho); }
        .fb-line { margin: 0 0 8px; font-size: 15px; line-height: 1.55; }
        .fb-given { text-decoration: line-through; opacity: .75; }
        .fb-answer { color: var(--ink); }
        .fb-exp { margin: 0 0 14px; font-size: 14px; color: var(--ink-soft); line-height: 1.55; }
        .diff-word { font-weight: 700; font-size: 1.1em; letter-spacing: .02em; }
        .diff-hl { background: var(--amarelo); color: #fff; border-radius: 4px; padding: 0 2px; }

        .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
        .table-card { background: var(--tile); border: 1px solid #dbe6f2; border-radius: var(--radius); padding: 18px; }
        .table-card h3 { font-family: 'Fraunces', serif; font-weight: 560; font-size: 17px; margin: 0 0 4px; }
        .table-note { font-size: 12px; color: var(--azul); font-weight: 600; margin: 0 0 12px; }
        .table-card dl { margin: 0; }
        .table-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #e3ecf5; font-size: 13.5px; }
        .table-row:last-child { border-bottom: none; }
        .table-row dt { font-weight: 700; min-width: 86px; color: var(--azul-deep); }
        .table-row dd { margin: 0; color: var(--ink-soft); line-height: 1.45; }

        .chip-group { margin: 4px 0 14px; }
        .chip-label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); margin: 0 0 8px; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
          background: var(--tile); border: 1.5px solid #c9d9ea; color: var(--azul-deep);
          border-radius: 999px; padding: 7px 16px; font-size: 14px; font-weight: 600;
          font-family: inherit; cursor: pointer; transition: background .12s ease, border-color .12s ease;
        }
        .chip:hover { border-color: var(--azul); }
        .chip-active { background: var(--azul); border-color: var(--azul); color: #fff; }
        .chip:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }

        .config-card { background: var(--tile); border: 1px solid #dbe6f2; border-radius: var(--radius); padding: 16px 18px; margin: 0 0 14px; }
        .config-card .chip-label { margin-top: 0; }

        .conj-head { display: flex; align-items: baseline; gap: 12px; margin: 18px 0 12px; flex-wrap: wrap; }
        .conj-verb { font-family: 'Fraunces', serif; font-weight: 560; font-size: 32px; margin: 0; color: var(--azul-deep); }
        .conj-tag { font-size: 12px; font-weight: 700; color: #9a6614; background: var(--ambar-wash); border: 1px solid #f0d9ae; border-radius: 999px; padding: 4px 12px; }
        .conj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
        .conj-card { background: var(--tile); border: 1px solid #dbe6f2; border-radius: var(--radius); padding: 14px 16px; }
        .conj-card h4 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--azul); margin: 0 0 10px; }
        .conj-card dl { margin: 0; }
        .conj-row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed #e3ecf5; font-size: 14px; }
        .conj-row:last-child { border-bottom: none; }
        .conj-row dt { color: var(--ink-soft); font-size: 12.5px; }
        .conj-row dd { margin: 0; font-weight: 600; color: var(--ink); font-family: 'Fraunces', serif; font-size: 15px; }

        .score-big { font-family: 'Fraunces', serif; font-size: 44px; font-weight: 560; color: var(--azul); line-height: 1; }
        .accent-note { background: var(--ambar-wash); border: 1px solid #f0d9ae; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
        .weak-note { font-size: 15px; margin: 14px 0 6px; }
        .miss-list { margin: 22px 0; display: flex; flex-direction: column; gap: 10px; }
        .miss-list h3 { font-family: 'Fraunces', serif; font-weight: 560; font-size: 20px; margin: 0 0 4px; }
        .miss-item { background: var(--tile); border: 1px solid #efc6bc; border-left: 4px solid var(--vermelho); border-radius: 10px; padding: 14px 16px; }
        .miss-accent { border-color: #f0d9ae; border-left-color: var(--amarelo); }
        .miss-q { font-family: 'Fraunces', serif; font-size: 16px; margin: 0 0 6px; }
        .miss-detail { font-size: 14px; margin: 0 0 6px; }
        .miss-exp { font-size: 13px; color: var(--ink-soft); margin: 0; line-height: 1.5; }

        @media (max-width: 480px) {
          body { padding: 18px 12px 48px; }
          .q-card { padding: 20px 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
          * { transition: none !important; }
        }
      
body { margin: 0; }
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
/* ============ Banco de preguntas ============ */
const TOPICS = [
  {
    id: "perfeito",
    title: "Pretérito Perfeito",
    sub: "Acciones terminadas · irregulares clave",
    questions: [
      { q: "Ontem eu ___ o dever de casa.", verb: "fazer", a: ["fiz"], exp: "FAZER es irregular en el perfeito: fiz, fez, fizemos, fizeram. Nada de “fazi”.", traps: { fazi: "“Fazi” no existe — FAZER cambia de raíz en el perfeito: eu fiz.", fez: "“Fez” es la forma de ele/ela/você. Para EU es “fiz”." } },
      { q: "Ela ___ uma ideia ótima na reunião.", verb: "ter", a: ["teve"], exp: "TER: tive, teve, tivemos, tiveram. La raíz cambia a tiv-.", traps: { teu: "“Teu” es un posesivo (tuyo). La forma de ela es “teve”.", tive: "“Tive” es para EU. Para ela/ele/você es “teve”." } },
      { q: "Nós ___ à praia no sábado.", verb: "ir", a: ["fomos"], exp: "IR y SER comparten formas en el perfeito: fui, foi, fomos, foram. El contexto decide el significado.", traps: { imos: "IR es totalmente irregular en el perfeito: nós fomos (igual que SER)." } },
      { q: "Vocês ___ resolver o problema?", verb: "poder", a: ["puderam"], exp: "PODER: pude, pôde, pudemos, puderam. Ojo con el cambio o → u.", traps: { poderam: "Casi — la raíz cambia: pud-. Es “puderam”, no “poderam”." } },
      { q: "Eu não ___ da festa até ontem.", verb: "saber", a: ["soube"], exp: "SABER: soube, soube, soubemos, souberam. En el perfeito suele significar “enterarse”.", traps: { sabi: "SABER es irregular: eu soube (= me enteré)." } },
      { q: "Ele ___ a verdade para todo mundo.", verb: "dizer", a: ["disse"], exp: "DIZER: disse, disse, dissemos, disseram. Doble s, sin acento.", traps: { dizeu: "DIZER cambia de raíz: ele disse.", diz: "“Diz” es presente. En perfeito: disse." } },
      { q: "Eles ___ de ônibus para o centro.", verb: "vir", a: ["vieram"], exp: "VIR: vim, veio, viemos, vieram. No confundir con VER (viram).", traps: { viram: "¡Trampa clásica! “Viram” es de VER. De VIR es “vieram”.", vinheram: "No existe — es “vieram”." } },
      { q: "Eu ___ no Rio na semana passada.", verb: "estar", a: ["estive"], exp: "ESTAR: estive, esteve, estivemos, estiveram. Raíz estiv-.", traps: { estava: "“Estava” es imperfeito (descripción). Para una acción puntual y terminada: estive." } },
      { q: "Você ___ sair ontem à noite?", verb: "querer", a: ["quis"], exp: "QUERER: quis, quis, quisemos, quiseram.", traps: { quereu: "QUERER es irregular: você quis." } },
      { q: "Ela ___ os documentos na mesa.", verb: "pôr", a: ["pôs"], exp: "PÔR: pus, pôs, pusemos, puseram. “Pôs” lleva acento circunflejo para distinguirse de “pos”.", traps: { ponhou: "No existe — PÔR: ela pôs." } },
      { q: "Nós ___ os salgados para a festa.", verb: "trazer", a: ["trouxemos"], exp: "TRAZER: trouxe, trouxe, trouxemos, trouxeram. La x suena como /s/.", traps: { trazemos: "“Trazemos” es presente. En perfeito la raíz cambia: trouxemos." } },
      { q: "Eu ___ um presente para ela.", verb: "dar", a: ["dei"], exp: "DAR: dei, deu, demos, deram.", traps: { dou: "“Dou” es presente. En perfeito: dei." } },
      { q: "Você ___ o jogo do Flamengo ontem?", verb: "ver", a: ["viu"], exp: "VER: vi, viu, vimos, viram. No confundir con VIR (veio).", traps: { veio: "“Veio” es de VIR (venir). De VER es “viu”." } },
      { q: "Ele ___ muito gentil comigo no primeiro dia.", verb: "ser", a: ["foi"], exp: "SER en perfeito = IR: fui, foi, fomos, foram.", traps: { era: "“Era” es imperfeito (descripción habitual). Para un hecho puntual y cerrado: foi." } },
    ],
  },
  {
    id: "imperfeito",
    title: "Pretérito Imperfeito",
    sub: "Hábitos y descripciones · solo 4 irregulares",
    questions: [
      { q: "Quando eu ___ criança, morava na Guatemala.", verb: "ser", a: ["era"], exp: "SER: era, era, éramos, eram. Uno de los únicos 4 irregulares del imperfeito (ser, ter, vir, pôr).", traps: { fui: "“Fui” es perfeito. Para describir una etapa de la vida: era." } },
      { q: "Antigamente nós ___ um cachorro.", verb: "ter", a: ["tínhamos"], exp: "TER: tinha, tinha, tínhamos, tinham. La forma de nós lleva acento: tínhamos.", traps: { temos: "“Temos” es presente. Hábito pasado: tínhamos." } },
      { q: "Ela sempre ___ nos visitar aos domingos.", verb: "vir", a: ["vinha"], exp: "VIR: vinha, vinha, vínhamos, vinham. “Sempre” + pasado = imperfeito.", traps: { veio: "“Veio” es perfeito (una vez). Con “sempre” (hábito): vinha." } },
      { q: "Eles ___ a mesa todos os dias.", verb: "pôr", a: ["punham"], exp: "PÔR: punha, punha, púnhamos, punham.", traps: { poniam: "Eso es español 🙂 En portugués: punham." } },
      { q: "Vocês ___ muito amigos na escola?", verb: "ser", a: ["eram"], exp: "SER: era, éramos, eram.", traps: { foram: "“Foram” es perfeito. Descripción de una relación en el pasado: eram." } },
      { q: "Eu ___ medo de escuro quando era pequeno.", verb: "ter", a: ["tinha"], exp: "TER: tinha. Estados y descripciones del pasado van en imperfeito." },
      { q: "Nós ___ vizinhos naquela época.", verb: "ser", a: ["éramos"], exp: "SER: éramos lleva acento agudo en la é.", traps: { eramos: "Te faltó el acento: éramos." } },
      { q: "Enquanto ele ___ para casa, começou a chover.", verb: "vir", a: ["vinha"], exp: "Acción en curso interrumpida por otra → imperfeito: vinha. La interrupción (começou) va en perfeito." },
      { q: "Eu ___ em Antigua antes de me mudar.", verb: "morar", a: ["morava"], exp: "Regular en -AR: -ava, -ava, -ávamos, -avam. Los regulares del imperfeito son muy estables." },
      { q: "Minha avó ___ açúcar demais no café.", verb: "pôr", a: ["punha"], exp: "PÔR: punha. Hábito del pasado → imperfeito." },
    ],
  },
  {
    id: "imperativo",
    title: "Modo Imperativo",
    sub: "Órdenes con você/vocês · irregulares",
    questions: [
      { q: "___ silêncio, por favor! (fazer, você)", verb: "fazer", a: ["faça"], exp: "Imperativo de você = presente de subjuntivo: faça. Con cedilha (ç).", traps: { faz: "“Faz” es el imperativo de TU. Para VOCÊ: faça.", faca: "“Faca” sin cedilha significa cuchillo 🔪 — es faça." } },

/* ============ Regulares generados (para balancear la práctica) ============ */
function makeRegular(name) {
  const conj = name.endsWith("ar") ? "ar" : name.endsWith("er") ? "er" : "ir";
  const s = name.slice(0, -2);
  const E = {
    ar: {
      pres: ["o", "a", "amos", "am"],
      perf: ["ei", "ou", "amos", "aram"],
      imp: ["ava", "ava", "ávamos", "avam"],
      imptv: ["e", "em"],
      sub: ["asse", "asse", "ássemos", "assem"],
    },
    er: {
      pres: ["o", "e", "emos", "em"],
      perf: ["i", "eu", "emos", "eram"],
      imp: ["ia", "ia", "íamos", "iam"],
      imptv: ["a", "am"],
      sub: ["esse", "esse", "êssemos", "essem"],
    },
    ir: {
      pres: ["o", "e", "imos", "em"],
      perf: ["i", "iu", "imos", "iram"],
      imp: ["ia", "ia", "íamos", "iam"],
      imptv: ["a", "am"],
      sub: ["isse", "isse", "íssemos", "issem"],
    },
  }[conj];
  const t = {
    pres: E.pres.map((e) => s + e),
    perf: E.perf.map((e) => s + e),
    imp: E.imp.map((e) => s + e),
    fut: ["ei", "á", "emos", "ão"].map((e) => name + e),
    fp: ["ia", "ia", "íamos", "iam"].map((e) => name + e),
    imptv: E.imptv.map((e) => s + e),
    sub: E.sub.map((e) => s + e),
  };
  return { name, group: "Regulares", tag: `regular -${conj.toUpperCase()}`, t };
}

/* ============ App (vanilla JS) ============ */
const $ = (id) => document.getElementById(id);
const strip = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const clean = (s) => s.trim().toLowerCase().replace(/\s+/g, " ");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const TENSE_NAME = Object.fromEntries(TENSE_LABELS.map(([k, l]) => [k, l]));
const TENSES_BY_TOPIC = { perfeito: ["perf"], imperfeito: ["imp"], imperativo: ["imptv"], futuro: ["fut"], futpret: ["fp"], condicional: ["sub", "fp"] };
const ALL_DRILL_TENSES = ["perf", "imp", "imptv", "fut", "fp", "sub"];
const FEEDBACK = {
  correct: { label: "Correto! \u2713", cls: "fb-correct" },
  accent: { label: "Casi \u2014 revisa el acento", cls: "fb-accent" },
  trap: { label: "Trampa cl\u00e1sica", cls: "fb-wrong" },
  wrong: { label: "Incorrecto", cls: "fb-wrong" },
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function genDrill(tKey, pool) {
  pool = pool || "both";
  const irregs = ALL_VERBS.filter((v) => v.group === "Irregulares");
  const regs = ALL_VERBS.filter((v) => v.group === "Regulares");
  const v = pool === "irreg" ? pick(irregs) : pool === "reg" ? pick(regs) : Math.random() < 0.6 ? pick(irregs) : pick(regs);
  const forms = v.t[tKey];
  const pi = Math.floor(Math.random() * forms.length);
  const persons = tKey === "imptv" ? ["voc\u00ea", "voc\u00eas"] : PERSONS;
  const condFrame = tKey === "sub" ? `Se ${persons[pi]} ___ \u2026 (${v.name})` : tKey === "fp" ? `${persons[pi]} ___ , se pudesse\u2026 (${v.name})` : null;
  return {
    drill: true,
    q: condFrame || `${persons[pi]} ___ (${v.name})`,
    verb: `${v.name} \u00b7 ${TENSE_NAME[tKey]}`,
    vName: v.name,
    infoKey: tKey,
    a: [forms[pi]],
    exp: `${TENSE_NAME[tKey]} de ${v.name.toUpperCase()}: ${forms.join(" \u00b7 ")}`,
    topicTitle: TENSE_NAME[tKey],
  };
}
const genAnyDrill = (tenses, pool) => genDrill(pick(tenses || ALL_DRILL_TENSES), pool);

function analyzeWrong(given, question) {
  const name = question.vName || question.verb;
  const v = ALL_VERBS.find((x) => x.name === name);
  if (!v) return null;
  const g = strip(clean(given));
  if (!g) return null;
  for (const [tk, label] of TENSE_LABELS) {
    const persons = tk === "imptv" ? ["voc\u00ea", "voc\u00eas"] : PERSONS;
    const forms = v.t[tk];
    for (let i = 0; i < forms.length; i++) {
      if (strip(forms[i].toLowerCase()) === g) {
        if (question.infoKey && tk === question.infoKey) {
          return `\u201c${given.trim()}\u201d s\u00ed es ${label} de ${name}, pero corresponde a \u201c${persons[i]}\u201d \u2014 f\u00edjate en la persona que pide la frase.`;
        }
        return `\u201c${given.trim()}\u201d existe, pero es ${label} (${persons[i]}) de ${name} \u2014 el tiempo no es el que pide el ejercicio.`;
      }
    }
  }
  return null;
}

function evaluate(input, question) {
  const given = clean(input);
  if (!given) return null;
  for (const acc of question.a) if (given === clean(acc)) return { status: "correct", expected: acc };
  for (const acc of question.a) if (strip(given) === strip(clean(acc))) return { status: "accent", expected: acc };
  if (question.traps) {
    for (const [wrong, msg] of Object.entries(question.traps))
      if (strip(given) === strip(clean(wrong))) return { status: "trap", expected: question.a[0], trapMsg: msg };
  }
  return { status: "wrong", expected: question.a[0] };
}

function diffHTML(expected, given) {
  const e = expected.toLowerCase();
  const g = clean(given);
  return ('<span class="diff-word">' + [...e].map((ch, i) => (g[i] === ch ? esc(ch) : `<span class="diff-hl">${esc(ch)}</span>`)).join("") + "</span>");
}

const S = { view: "home", verbName: "falar", quiz: null, showInfo: false, infTenses: ALL_DRILL_TENSES.slice(), infPool: "both" };

const App = {
  home() { S.view = "home"; render(); },
  tables() { S.view = "tables"; render(); },
  conjugador() { S.view = "conjugador"; render(); },
  setVerb(n) { S.verbName = n; render(); },
  toggleInfo() { S.showInfo = !S.showInfo; render(); },

  startTopic(id) {
    const topic = TOPICS.find((t) => t.id === id);
    const curated = shuffle(topic.questions).slice(0, 8).map((q) => Object.assign({}, q, { topicTitle: topic.title, infoKey: TOPIC_INFO_KEY[topic.id] }));
    const tenses = TENSES_BY_TOPIC[id] || [];
    const drills = [];
    for (let i = 0; i < (tenses.length ? 6 : 0); i++) drills.push(genDrill(tenses[i % tenses.length]));
    startQuiz(topic.title, shuffle(curated.concat(drills)), false);
  },
  simulado() {
    let qs = [];
    TOPICS.forEach((t) => { qs = qs.concat(shuffle(t.questions).slice(0, 2).map((q) => Object.assign({}, q, { topicTitle: t.title, infoKey: TOPIC_INFO_KEY[t.id] }))); });
    ALL_DRILL_TENSES.forEach((tk) => qs.push(genDrill(tk)));
    startQuiz("Simulado geral", shuffle(qs), false);
  },
  infConfig() { S.view = "infconfig"; render(); },
  toggleTense(tk) {
    const i = S.infTenses.indexOf(tk);
    if (i >= 0) S.infTenses.splice(i, 1); else S.infTenses.push(tk);
    render();
  },
  toggleAllTenses() {
    S.infTenses = S.infTenses.length === ALL_DRILL_TENSES.length ? [] : ALL_DRILL_TENSES.slice();
    render();
  },
  setPool(p) { S.infPool = p; render(); },
  infinite() {
    const tenses = S.infTenses.length ? S.infTenses.slice() : ALL_DRILL_TENSES.slice();
    startQuiz("Pr\u00e1tica infinita", [genAnyDrill(tenses, S.infPool)], true);
    S.quiz.tenses = tenses; S.quiz.pool = S.infPool;
    render();
  },
  retryMisses() {
    const seen = new Set();
    const qs = S.quiz.log.filter((l) => l.status !== "correct").map((l) => l.q)
      .filter((q) => (seen.has(q.q) ? false : (seen.add(q.q), true)));
    if (!qs.length) return;
    startQuiz("Repaso de fallos", shuffle(qs), false);
  },

  check() {
    const q = cur();
    const val = $("answer") ? $("answer").value : "";
    const r = evaluate(val, q);
    if (!r) return;
    S.quiz.result = r;
    S.quiz.given = val;
    S.quiz.log.push(Object.assign({}, r, { given: val, q }));
    render();
  },
  next() {
    if (S.quiz.infinite) {
      S.quiz.questions.push(genAnyDrill(S.quiz.tenses, S.quiz.pool));
      S.quiz.idx++; S.quiz.result = null; S.quiz.given = ""; S.showInfo = false;
      render(); return;
    }
    if (S.quiz.idx + 1 >= S.quiz.questions.length) { S.view = "results"; render(); }
    else { S.quiz.idx++; S.quiz.result = null; S.quiz.given = ""; S.showInfo = false; render(); }
  },
  exitQuiz() {
    if (S.quiz && S.quiz.infinite && S.quiz.log.length) S.view = "results";
    else S.view = "home";
    render();
  },
};

function startQuiz(title, questions, infinite) {
  S.showInfo = false;
  S.quiz = { title, questions, infinite, idx: 0, result: null, given: "", log: [] };
  S.view = "quiz";
  render();
}
const cur = () => S.quiz.questions[S.quiz.idx];

function onKey(e) {
  if (e.key === "Enter") { e.preventDefault(); S.quiz.result ? App.next() : App.check(); }
}

    if (r.status === "accent") line = `Escribiste <span class="fb-given">${esc(S.quiz.given.trim())}</span> \u2014 la forma correcta es ${diffHTML(r.expected, S.quiz.given)}. La letra marcada lleva la diferencia.`;
    if (r.status === "trap") line = `<span class="fb-given">${esc(S.quiz.given.trim())}</span> \u2192 ${esc(r.trapMsg)} Correcto: <strong class="fb-answer">${esc(r.expected)}</strong>`;
    if (r.status === "wrong") {
      line = `Escribiste <span class="fb-given">${esc(S.quiz.given.trim())}</span>. Correcto: ${diffHTML(r.expected, S.quiz.given)} \u2014 las letras marcadas son las que cambian.`;
      const a = analyzeWrong(S.quiz.given, q);
      if (a) why = `<p class="fb-why">\ud83d\udca1 ${esc(a)}</p>`;
    }
    const icon = r.status === "correct" ? "\u2713" : r.status === "accent" ? "\u00b4" : "\u2715";
    const forma = r.status !== "correct" && q.infoKey && TENSE_INFO[q.infoKey]
      ? `<p class="fb-forma">\ud83d\udcd0 C\u00f3mo se forma: ${esc(TENSE_INFO[q.infoKey].forma)}</p>` : "";
    fbHtml = `
    <div class="feedback ${fb.cls}">
      <p class="fb-label"><span class="fb-icon">${icon}</span>${fb.label}</p>
      ${line ? `<p class="fb-line">${line}</p>` : ""}
      ${why}
      <p class="fb-exp">${esc(q.exp)}</p>
      ${forma}
      <button id="nextBtn" class="btn-primary" onclick="App.next()">${S.quiz.infinite || S.quiz.idx + 1 < total ? "Siguiente" : "Ver resultados"} \u2192</button>
    </div>`;
  }

  return `
  <div class="quiz-top">
    <button class="btn-back" onclick="App.exitQuiz()">\u2190 ${S.quiz.infinite ? "Terminar" : "Salir"}</button>
    <span class="quiz-progress">${esc(S.quiz.title)} \u00b7 ${counter}</span>
  </div>
  ${progress}
  <div class="q-card">
    ${q.infoKey && TENSE_INFO[q.infoKey] ? `
    <div class="tense-block">
      <button class="tense-chip ${S.showInfo ? "tense-chip-open" : ""}" onclick="App.toggleInfo()"><span class="tense-dot">?</span> ${esc(TENSE_INFO[q.infoKey].name)}</button>
      ${S.showInfo ? `<div class="tense-panel">
        <p><strong>\u00bfQu\u00e9 expresa?</strong> ${esc(TENSE_INFO[q.infoKey].que)}</p>
        <p><strong>\u00bfC\u00f3mo se forma?</strong> ${esc(TENSE_INFO[q.infoKey].forma)}</p>
      </div>` : ""}
    </div>` : ""}
    <p class="q-hint">Verbo: <strong>${esc(q.verb)}</strong>${q.topicTitle && (q.drill || S.quiz.title === "Simulado geral") ? `<span class="q-topic"> \u00b7 ${esc(q.topicTitle)}</span>` : ""}</p>
    <p class="q-sentence">${esc(parts[0])}<input id="answer" class="q-input ${r ? fb.cls + "-input" : ""}" ${r ? "disabled" : ""} placeholder="\u2026" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off"/>${esc(parts[1] || "")}</p>
    ${!r ? `<div class="q-actions"><button class="btn-primary" onclick="App.check()">Verificar</button><span class="kbd-hint">o pulsa Enter</span></div>` : ""}
    ${fbHtml}
  </div>`;
}

function vResults() {
  const log = S.quiz ? S.quiz.log : [];
  const total = log.length;
  const correct = log.filter((l) => l.status === "correct").length;
  const accents = log.filter((l) => l.status === "accent").length;
  const misses = log.filter((l) => l.status !== "correct");
  const byTopic = {};
  log.forEach((l) => {
    const t = l.q.topicTitle || "Geral";
    byTopic[t] = byTopic[t] || { ok: 0, total: 0 };
    byTopic[t].total++;
    if (l.status === "correct") byTopic[t].ok++;
  });
  const weak = Object.entries(byTopic).filter(([, v]) => v.ok / v.total < 0.7).map(([k]) => k);
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const msg = pct >= 80 ? "Est\u00e1 pronto! \ud83c\udf89" : pct >= 60 ? "Quase l\u00e1 \u2014 repasa los fallos abajo." : "Respira: repasa las tablas y vuelve a intentarlo.";

  return `
  <h2 class="section-title">Resultado</h2>
  <div class="score">
    <div class="donut" style="background:conic-gradient(${pct >= 80 ? "var(--verde)" : pct >= 60 ? "var(--amarelo)" : "var(--vermelho)"} ${pct * 3.6}deg, var(--azul-wash) 0deg)"><span class="donut-center">${pct}%</span></div>
    <div><span class="score-big">${correct}/${total}</span><p class="score-pct">${msg}</p></div>
  </div>
  ${accents > 0 ? `<p class="accent-note">\u26a0 ${accents} ${accents === 1 ? "respuesta era correcta salvo por el acento" : "respuestas eran correctas salvo por el acento"}. En el examen escrito eso descuenta \u2014 rep\u00e1salos abajo.</p>` : ""}
  ${weak.length ? `<p class="weak-note">Temas para repasar: <strong>${weak.map(esc).join(" \u00b7 ")}</strong></p>` : ""}
  ${misses.length ? `
    <div class="miss-list">
      <h3>Lo que hay que corregir</h3>
      ${misses.map((m) => `
        <div class="miss-item ${m.status === "accent" ? "miss-accent" : ""}">
          <p class="miss-q">${esc(m.q.q.replace("___", `[${m.q.a[0]}]`))}</p>
          <p class="miss-detail">Tu respuesta: <span class="fb-given">${esc(m.given.trim())}</span>${m.status === "accent" ? ` \u00b7 solo falt\u00f3 el acento: ${diffHTML(m.q.a[0], m.given)}` : ` \u00b7 correcto: <strong>${esc(m.q.a[0])}</strong>`}</p>
          <p class="miss-exp">${esc(m.q.exp)}</p>
        </div>`).join("")}
    </div>` : ""}
  <div class="hero-actions">
    ${misses.length ? `<button class="btn-primary btn-amber" onclick="App.retryMisses()">Practicar solo los fallos (${new Set(misses.map((m) => m.q.q)).size})</button>` : ""}
    <button class="btn-primary" onclick="App.home()">Volver al inicio</button>
    <button class="btn-ghost" onclick="App.conjugador()">Conjugador</button>
    <button class="btn-ghost" onclick="App.tables()">Repasar tablas</button>
  </div>`;
}

function render() {
  const root = $("app");
  const views = { home: vHome, tables: vTables, conjugador: vConjugador, quiz: vQuiz, results: vResults, infconfig: vInfConfig };
  root.innerHTML = views[S.view]();
  if (S.view === "quiz") {
    const a = $("answer");
    if (a) {
      a.value = S.quiz.given || "";
      a.addEventListener("keydown", onKey);
      if (!S.quiz.result) a.focus();
    }
    const n = $("nextBtn");
    if (n) n.focus();
    document.addEventListener("keydown", quizEnter);
  } else {
    document.removeEventListener("keydown", quizEnter);
  }
  window.scrollTo(0, 0);
}
function quizEnter(e) {
  if (e.key === "Enter" && S.view === "quiz" && S.quiz.result) { e.preventDefault(); App.next(); }
}

render();

/* ---------- PWA ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

</script>
</body>
</html>
